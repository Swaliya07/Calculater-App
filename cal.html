<!DOCTYPE html>
<html>
<head>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  background: rgb(130, 103, 126);
  height:100vh;
  font-family: Arial, sans-serif;
} 

.cal{
  background: rgb(34, 29, 29);
  padding:30px;
  border-radius:20px;
  box-shadow:0 5px 15px rgb(242, 240, 240);
}

#display{
  width:100%;
  height:70px;
  text-align:right;
  margin-bottom:20px;
  font-size:20px;
  padding:15px;
  box-sizing:border-box;
  border-radius:20px;
  border:none;
  background:white;
  color:#271919;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

button{
  height:50px;
  font-size:30px;
  border:none;
  border-radius:10px;
  background:#eee;
  cursor:pointer;
}

button:hover{
  background:#ddd;
}

#equal{
  grid-column:span 2;
  background:#4caf50;
  color:white;
}

#clear{
  background:#f44336;
  color:white;
}
</style>
</head>

<body>

<div class="cal">
  <input id="display" readonly>

  <div class="buttons">
    <button onclick="c.add('7')">7</button>
    <button onclick="c.add('8')">8</button>
    <button onclick="c.add('9')">9</button>
    <button onclick="c.add('/')">/</button>

    <button onclick="c.add('4')">4</button>
    <button onclick="c.add('5')">5</button>
    <button onclick="c.add('6')">6</button>
    <button onclick="c.add('*')">*</button>

    <button onclick="c.add('1')">1</button>
    <button onclick="c.add('2')">2</button>
    <button onclick="c.add('3')">3</button>
    <button onclick="c.add('-')">-</button>

    <button onclick="c.add('0')">0</button>
    <button onclick="c.add('.')">.</button>
    <button onclick="c.add('00')">00</button>
    <button onclick="c.add('%')">%</button>

     <button onclick="c.add('+')">+</button>
     <button id="equal" onclick="c.equal()">=</button>
     <button id="clear" onclick="c.clear()">C</button>
   
  </div>
</div>

<script>
class Calc {

  add(v){
    let d = document.getElementById("display");
    d.value = d.value + v;
  }

  clear(){
    document.getElementById("display").value = "";
  }

  equal(){
    let d = document.getElementById("display");
    try{
      d.value = eval(d.value);
    }catch{
      d.value = "Error";
    }
  }
}

let c = new Calc();
</script>

</body>
</html>
